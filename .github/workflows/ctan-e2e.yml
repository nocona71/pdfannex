name: CTAN archive end-to-end test

# Installs the CTAN archive into a fresh Ubuntu container with only the TeX
# Live packages a user would have, and builds documents with it.
on:
  workflow_call:
    inputs:
      release_tag:
        description: Release tag whose archive to test; ignored when artifact is set
        required: false
        default: ""
        type: string
      artifact:
        description: Name of a workflow artifact containing the archive built by an earlier job
        required: false
        default: ""
        type: string
      adapter_artifact:
        description: Name of a workflow artifact containing the adapter archive built by an earlier job
        required: false
        default: ""
        type: string
      core_tds_artifact:
        description: Name of a workflow artifact containing the core TDS archive
        required: false
        default: ""
        type: string
      adapter_tds_artifact:
        description: Name of a workflow artifact containing the adapter TDS archive
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag whose archive to test (for example pdfannex-v1.0.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.sha }}

      - name: Get CTAN archive from earlier job
        if: inputs.artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: archive/core

      - name: Get adapter CTAN archive from earlier job
        if: inputs.adapter_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.adapter_artifact }}
          path: archive/adapter

      - name: Get CTAN archive from release
        if: inputs.artifact == ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p archive/core
          gh release download "$RELEASE_TAG" --pattern 'pdfannex-ctan-v*.zip' --dir archive/core

      - name: Get adapter CTAN archive from release
        if: inputs.adapter_artifact == ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p archive/adapter
          gh release download "$RELEASE_TAG" --pattern 'pdfannex-docstore-ctan-v*.zip' --dir archive/adapter

      - name: Get core TDS archive from earlier job
        if: inputs.core_tds_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.core_tds_artifact }}
          path: tds/core

      - name: Get adapter TDS archive from earlier job
        if: inputs.adapter_tds_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.adapter_tds_artifact }}
          path: tds/adapter

      - name: Build TDS archives when not supplied
        if: inputs.core_tds_artifact == '' || inputs.adapter_tds_artifact == ''
        env:
          CORE_TDS_ARTIFACT: ${{ inputs.core_tds_artifact }}
          ADAPTER_TDS_ARTIFACT: ${{ inputs.adapter_tds_artifact }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make texlive-extra-utils texlive-fonts-recommended texlive-latex-base \
            texlive-latex-extra texlive-luatex texlive-xetex
          make package adapter-package
          mkdir -p tds/core tds/adapter
          if [[ -z "$CORE_TDS_ARTIFACT" ]]; then
            cp build/distrib/tds/pdfannex.tds.zip tds/core/
          fi
          if [[ -z "$ADAPTER_TDS_ARTIFACT" ]]; then
            cp adapter-example/build/distrib/tds/pdfannex-docstore.tds.zip tds/adapter/
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build clean TeX image (layers cached between runs)
        uses: docker/build-push-action@v6
        with:
          context: .github/e2e
          load: true
          tags: pdfannex-e2e:clean
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test core package in a fresh container
        run: |
          docker run --rm -v "$PWD:/w:ro" pdfannex-e2e:clean bash -euxo pipefail -c '
            /w/scripts/e2e-ctan /w/archive/core/pdfannex-ctan*.zip
            python3 /w/testfiles/texlive_e2e.py \
              core /w/tds/core/pdfannex.tds.zip
          '

      - name: Test adapter and its core dependency in a fresh container
        run: |
          docker run --rm -v "$PWD:/w:ro" pdfannex-e2e:clean bash -euxo pipefail -c '
            python3 /w/adapter-example/e2e_ctan.py \
              /w/archive/core/pdfannex-ctan*.zip \
              /w/archive/adapter/pdfannex-docstore-ctan*.zip
            python3 /w/testfiles/texlive_e2e.py \
              adapter \
              /w/tds/core/pdfannex.tds.zip \
              /w/tds/adapter/pdfannex-docstore.tds.zip
          '
