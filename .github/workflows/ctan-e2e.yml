name: CTAN archive end-to-end test

# Installs the CTAN archive into a fresh Ubuntu container with only the TeX
# Live packages a user would have, and builds documents with it.
on:
  workflow_call:
    inputs:
      release_tag:
        description: Release tag whose archive to test; ignored when artifact is set
        required: false
        default: ""
        type: string
      artifact:
        description: Name of a workflow artifact containing the archive built by an earlier job
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag whose archive to test (for example pdfannex-v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get CTAN archive from earlier job
        if: inputs.artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: archive

      - name: Get CTAN archive from release
        if: inputs.artifact == ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release download "$RELEASE_TAG" --pattern 'pdfannex-ctan-v*.zip' --dir archive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build clean TeX image (layers cached between runs)
        uses: docker/build-push-action@v6
        with:
          context: .github/e2e
          load: true
          tags: pdfannex-e2e:clean
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test archive in a clean container
        run: docker run --rm -v "$PWD:/w:ro" pdfannex-e2e:clean bash -euxo pipefail -c '/w/scripts/e2e-ctan /w/archive/*.zip'
