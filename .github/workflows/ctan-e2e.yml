name: CTAN archive end-to-end test

# Installs the CTAN archive into a fresh Ubuntu container with only the TeX
# Live packages a user would have, and builds documents with it.
on:
  workflow_call:
    inputs:
      release_tag:
        description: Release tag whose archive to test; ignored when artifact is set
        required: false
        default: ""
        type: string
      artifact:
        description: Name of a workflow artifact containing the archive built by an earlier job
        required: false
        default: ""
        type: string
      tds_artifact:
        description: Name of a workflow artifact containing the TDS archive
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag whose archive to test (for example pdfannex-v1.0.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.sha }}

      - name: Get CTAN archive from earlier job
        if: inputs.artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: archive/core

      - name: Get CTAN archive from release
        if: inputs.artifact == ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p archive/core
          gh release download "$RELEASE_TAG" --pattern 'pdfannex-ctan-v*.zip' --dir archive/core

      - name: Get TDS archive from earlier job
        if: inputs.tds_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.tds_artifact }}
          path: tds

      - name: Build TDS archive when not supplied
        if: inputs.tds_artifact == ''
        run: |
          apt_options=(
            -o Acquire::Retries=1
            -o Acquire::http::Timeout=10
            -o Acquire::https::Timeout=10
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends \
            make texlive-extra-utils texlive-fonts-recommended texlive-latex-base \
            texlive-latex-extra texlive-luatex texlive-xetex
          make package
          mkdir -p tds
          cp build/distrib/tds/pdfannex.tds.zip tds/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build clean TeX image (layers cached between runs)
        uses: docker/build-push-action@v6
        with:
          context: .github/e2e
          load: true
          tags: pdfannex-e2e:clean
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test core package in a fresh container
        run: |
          docker run --rm -v "$PWD:/w:ro" pdfannex-e2e:clean bash -euxo pipefail -c '
            /w/scripts/e2e-ctan /w/archive/core/pdfannex-ctan*.zip
            python3 /w/testfiles/texlive_e2e.py \
              /w/tds/pdfannex.tds.zip
          '
