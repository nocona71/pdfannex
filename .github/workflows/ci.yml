name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk make poppler-utils shellcheck texlive-extra-utils texlive-latex-base \
            texlive-latex-extra texlive-luatex texlive-xetex

      - name: Check
        run: make check

      - name: Build documentation
        run: make doc

