name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install TeX tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk make poppler-utils shellcheck texlive-extra-utils texlive-fonts-recommended texlive-latex-base \
            texlive-latex-extra texlive-luatex texlive-xetex

      - name: Check
        run: make check

      - name: Build documentation
        run: make doc

      - name: Build CTAN archive
        run: make package

      - name: Upload CTAN archive
        uses: actions/upload-artifact@v5
        with:
          name: ctan-archive
          path: build/pdfannex-ctan.zip
          if-no-files-found: error

  ctan-e2e:
    needs: check
    uses: ./.github/workflows/ctan-e2e.yml
    with:
      artifact: ctan-archive
