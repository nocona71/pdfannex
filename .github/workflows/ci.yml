name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install TeX tooling
        run: |
          apt_options=(
            -o Acquire::Retries=1
            -o Acquire::http::Timeout=10
            -o Acquire::https::Timeout=10
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends \
            latexmk make poppler-utils shellcheck texlive-extra-utils texlive-fonts-recommended texlive-latex-base \
            texlive-latex-extra texlive-luatex texlive-xetex

      - name: Check
        run: make check

      - name: Build documentation
        run: make doc

      - name: Build CTAN archive
        run: make package

      - name: Upload CTAN archive
        uses: actions/upload-artifact@v7
        with:
          name: ctan-archive
          path: build/pdfannex-ctan.zip
          if-no-files-found: error

      - name: Upload core TDS archive
        uses: actions/upload-artifact@v7
        with:
          name: pdfannex-tds-archive
          path: |
            build/distrib/tds/pdfannex.tds.zip
            build/distrib/tds/install-texmfhome-tds.sh
          if-no-files-found: error

  ctan-e2e:
    needs: check
    uses: ./.github/workflows/ctan-e2e.yml
    with:
      artifact: ctan-archive
      tds_artifact: pdfannex-tds-archive

  windows-cli:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install TeX Live
        uses: zauguin/install-texlive@v4.4.0
        with:
          packages: >-
            latex-bin
            luatex
            luaotfload

      - name: Test CLI paths and resolver process
        run: python testfiles/test_cli.py CliProcess
