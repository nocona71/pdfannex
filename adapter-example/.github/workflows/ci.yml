# Template only while adapter-example is a subdirectory; GitHub activates it
# when this directory is separated into its own repository.
name: Adapter CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout adapter
        uses: actions/checkout@v6

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl poppler-utils python3 texlive-latex-base texlive-latex-extra texlive-luatex

      - name: Checkout pdfannex for integration tests
        uses: actions/checkout@v6
        with:
          repository: nocona71/pdfannex
          path: pdfannex

      - name: Test adapter
        uses: ./.github/actions/test
        with:
          pdfannex-home: pdfannex
