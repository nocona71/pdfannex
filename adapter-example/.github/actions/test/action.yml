name: Test pdfannex adapter
description: Run the adapter module and pdfannex integration tests
inputs:
  pdfannex-home:
    description: Path to a pdfannex source checkout, relative to the adapter directory or absolute
    required: false
    default: ..
runs:
  using: composite
  steps:
    - name: Run adapter tests
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PDFANNEX_HOME: ${{ inputs.pdfannex-home }}
      run: |
        cd "$ACTION_PATH/../../.."
        if [[ "$PDFANNEX_HOME" != /* ]]; then
          PDFANNEX_HOME="$PWD/$PDFANNEX_HOME"
          export PDFANNEX_HOME
        fi
        make test
